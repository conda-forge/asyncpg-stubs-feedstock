# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.32.0"
  python_check_max: "3.14"

package:
  name: asyncpg-stubs
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/a/asyncpg-stubs/asyncpg_stubs-${{ version }}.tar.gz
  sha256: 0c6644e41e2756b49ba0ce95eba289450e3a3a6ee54cc4faf20d218705734630

build:
  number: 0
  noarch: python
  script:
    - ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation --disable-pip-version-check --check-build-dependencies

requirements:
  host:
    - pip
    - poetry-core >=2.0.0,<3.0.0
    - python ${{ python_min }}.*
  run:
    - asyncpg >=0.32,<0.33
    - python >=${{ python_min }}
    - typing_extensions >=4.16.0,<5.0.0

tests:
  - package_contents:
      strict: true
      site_packages:
        - asyncpg-stubs/__init__.pyi
        - asyncpg-stubs/**
        - asyncpg_stubs-${{ version }}.dist-info/**
  - python:
      imports: asyncpg
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - ${{ python_check_max }}.*
  - requirements:
      run:
        - python ${{ python_min }}.*
        - mypy
    script:
      - mypy -p asyncpg

about:
  summary: asyncpg stubs
  license: BSD-3-Clause
  license_file: LICENSE
  homepage: https://pypi.org/project/asyncpg-stubs
  repository: https://github.com/bryanforbes/asyncpg-stubs

extra:
  recipe-maintainers:
    - bollwyvl
